.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 6px}
.opt{font-size:17.5px;min-height:54px;padding:8px 12px;border-radius:12px;border:1.5px solid #c9c2b3;background:#fff;cursor:pointer;text-align:left;font-family:inherit}
.opt.on{background:#e3eeea;border-color:#2f5d50;color:#1f4238;font-weight:700}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px}
.follow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff4dc;padding:10px;border-radius:10px;margin:8px 0}.follow>span{width:100%;font-weight:600}
.fb{margin-top:14px;border:2px dashed #b3261e;border-radius:12px;padding:12px;background:#fffafa}
.fb summary{cursor:pointer;font-weight:700;color:#b3261e;font-size:16.5px}
.fb .opts{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid #c9c2b3;border-radius:999px;padding:6px 12px;font-size:15px;background:#fff;cursor:pointer;font-family:inherit}
.chip.on{background:#b3261e;border-color:#b3261e;color:#fff}
.fbtag{font-size:13px;border-radius:999px;padding:1px 8px;margin-left:6px;background:#e2ddd2;color:#33424a;font-weight:600}
.bottom[hidden]{display:none}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e2ddd2;padding:10px 12px;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;z-index:10;max-width:760px;margin:0 auto}

ul.list{padding-left:20px}ul.list li{margin:6px 0}
.tag{color:#b3261e;font-weight:700;font-size:15px;margin:0 0 4px}
.link{background:none;border:0;color:#2f5d50;text-decoration:underline;font-size:18px;padding:0;cursor:pointer;text-align:left;font-family:inherit}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:rgba(31,42,46,.88);color:#fff;padding:6px 16px;border-radius:999px;font-size:15px;z-index:11}
.sim{border:2px dashed #c9c2b3;border-radius:12px;padding:16px;text-align:center;color:#5b6a70;margin:10px 0}
</style>

le": "例：已經在醫院簽過，選「已簽署」，並把文件拍照上傳；還在考慮選「有意願但尚未完成」。選哪一項都不會影響是否能入住。"}, {"id": "other_notes", "label": "還有沒有前面未提到、希望護評人員知道的事", "options": ["有", "無", "稍後補充", "請客服協助"], "detailPlaceholder": "可自由敘明任何特殊需求或疑問", "example": "例：選「有」，補充：長輩怕冷，晚上要多一條被子；有一隻每天要摸的小狗玩偶。真的沒有請選「無」。"}]}], "notices": [{"id": "behavior_safety", "title": "行為安全與照護配合", "summary": "以具體行為、發生情境與可行的安撫方式評估照護安全，不因診斷名稱或單一行為自動拒絕入住。", "body": ["請如實說明走失、攻擊、自傷、性行為、拒絕照護或其他可能影響安全的具體情形。", "機構會再確認發生時間、頻率、誘發原因、曾造成的傷害，以及家中有效的安撫方式。", "這些資料用於安排電訪與照護準備，不會由系統自動作成承接決定。"], "taiwanese": "請照實講長輩敢有走失、推人、傷害家己，抑是無愛予人照顧的情形。咱欲了解發生的時間、次數、原因，閣有按怎安撫較有效。這是欲準備照顧，毋是予系統家己決定收抑無收。"}, {"id": "smoking_drinking", "title": "飲酒、抽菸與危險物品", "summary": "團體生活環境需事先掌握飲酒、抽菸、打火機或其他危險物品的使用習慣。", "body": ["請說明目前飲酒或抽菸的種類、頻率、時間、是否能配合指定區域與保管規範。", "入住後若有火源、酒精或其他可能危及自己與他人的物品，需依機構安全流程共同處理。"], "taiwanese": "若長輩有食酒、食薰，抑是會帶火拭仔佮危險物件，請講清楚種類、次數佮時間。入住了後，愛照機構的安全規定做伙處理。"}, {"id": "dnr", "title": "DNR／預立醫療照護意願", "summary": "只記錄目前文件與討論狀態，供後續核對；不納入適配評分，也不代表已完成法律文件。", "body": ["本系統只記錄：已簽署、未簽署、有意願尚未完成，或不確定。", "若已有文件，可在醫療文件區上傳供人工核對；沒有文件仍可繼續諮詢。", "此紀錄不影響適配評分，正式醫療決策仍依有效文件、醫療專業與當事人意願辦理。"], "taiwanese": "這馬干焦記錄 DNR 是已經簽、猶未簽、有意願猶未完成，抑是毋確定。有文件會使上傳予人確認；無文件嘛會使繼續諮詢。這項袂予系統提來評分抑是決定敢會使入住。"}, {"id": "restraint", "title": "約束與替代照護原則", "summary": "約束不是例行照護；若有立即安全風險，會先評估原因與可行的替代措施。", "body": ["機構不會把綁束、床欄或限制活動視為方便管理的常規方法。", "如遇立即危險，會依規範評估、告知、記錄並持續檢討，優先採用陪伴、環境調整與其他替代方式。", "請說明家中曾使用的方式、原因、時間與效果，供電訪人員進一步確認。"], "taiwanese": "機構袂共綁牢、床欄抑是限制活動當作平常的照顧方式。若有即時危險，會先想陪伴、環境調整佮其他替代方法，嘛會照規定告知、記錄佮檢討。"}, {"id": "group_infection", "title": "團體生活與感染風險", "summary": "入住後需共同配合作息、公共空間與感染管制；個別需求可先提出討論。", "body": ["團體生活包含用餐、洗澡、活動、探視與休息安排，機構會依照護需要與安全調整。", "如有發燒、呼吸道或腸胃症狀、接觸史或醫師指示，請主動告知並配合必要的檢查、隔離或防護措施。", "若有宗教、飲食、睡眠或溝通需求，請先提出，由人員評估可行安排。"], "taiwanese": "團體生活有食飯、洗身軀、活動、探視佮睏覺的安排。若有發燒、喘嗽、腹瀉抑是接觸著傳染病，請主動講，配合檢查、隔離佮保護。特別的宗教、食物、睏覺佮溝通需要，嘛請代先提出來討論。"}, {"id": "emergency_accompaniment", "title": "緊急送醫與急診陪同", "summary": "發生緊急狀況時，機構先依急救流程處理並聯絡家屬；陪同與後續安排需事先確認。", "body": ["機構會依現場狀況進行必要急救、聯絡 119 或安排就醫，並通知諮詢人或指定聯絡人。", "家屬需提供可聯絡時段、備援聯絡人，以及急診陪同、醫療決策與返院交通的安排。", "實際處置仍依當時病況、醫療專業與有效醫療意願文件辦理。"], "taiwanese": "若有緊急代誌，機構會照現場情形急救、拍一一九抑是送病院，嘛會通知諮詢人。家屬愛代先講陪急診、醫療決定、轉來轉去佮第二聯絡人的安排。實際按怎做，愛看彼當時的病況佮有效的醫療文件。"}, {"id": "transfer_discharge", "title": "照護安全異動與轉介原則", "summary": "若健康或行為狀況改變，先具體評估需要的照護與可行調整，再由人員共同討論後續安排。", "body": ["如出現原先未揭露或入住後新發生的高風險行為、感染、醫療或照護需求，機構會先記錄事實並與家屬討論。", "若現場照護方式仍不足以維持本人或他人安全，會說明已嘗試的措施、待補充資料與建議的醫療或照護轉介。", "系統只整理已確認事實與問卷矛盾供人員判斷，不使用污名化文字，也不自動作成退住或轉介決定。"], "taiwanese": "若入住進前無講著，抑是入住了後新發生危險行為、傳染、醫療佮照顧需要，機構會先記錄事實，佮家屬討論。若現場的照顧猶無夠安全，會講明試過啥物方法、欠啥物資料，閣由人共同決定後續，毋是予系統自動決定退住抑是轉介。"}]};

  if (q.kind === 'fields') { if (a.value === '不清楚') return true; var ids = q.requiredFieldIds || (q.fields || []).map(function (f) { return f.id; }); return ids.length > 0 && ids.every(function (k) { return (a.fields[k] || '').trim(); }); }
  return !!a.value;
}
function display(q) {
  var a = ans(q.id), s = sel(q, a);
  var f = (q.fields || []).filter(function (x) { return (a.fields[x.id] || '').trim(); }).map(function (x) { return x.label + '：' + a.fields[x.id] + (x.unit ? ' ' + x.unit : ''); });
  var fu = a.followUp === 'later' ? '（稍後補充）' : a.followUp === 'customer_service' ? '（請客服協助）' : '';

}
function fbOf(key) { return S.fb[key] || (S.fb[key] = { verdict: '', issues: [], suggestion: '', reason: '' }); }
function fbDone(key) { var f = S.fb[key]; return f && (f.verdict || f.suggestion || f.reason); }

// ── 畫面 ──
function render() {
  var app = document.getElementById('app'), nav = document.getElementById('nav');
  if (!S.started) { nav.hidden = true; app.innerHTML = startView(); bindStart(); return; }
  nav.hidden = false;
  var cur = STEPS[S.step][0], sec = DATA.secs.filter(function (s) { return s.id === cur; })[0];
  var done = ALLQ.filter(answered).length, fbn = ALLQ.filter(function (q) { return fbDone('q:' + q.id); }).length;
  var h = '<div class="progress"><div class="bar"><span style="width:' + Math.round(done / ALLQ.length * 100) + '%"></span></div>' +
    '<div class="ptext">已試填 ' + done + '／' + ALLQ.length + ' 題・已給建議 ' + fbn + ' 題・第 ' + (S.step + 1) + '／' + STEPS.length + ' 步：' + esc(STEPS[S.step][1]) + '</div>' +
    '<select id="jump" style="min-height:44px;font-size:16px;padding:6px 10px">' + STEPS.map(function (s, i) { return '<option value="' + i + '"' + (i === S.step ? ' selected' : '') + '>' + (i + 1) + '. ' + esc(s[1]) + '</option>'; }).join('') + '</select></div>';
  h += '<div class="note warn small">測試者：' + esc(S.tester) + '（' + esc(S.role) + '）　請以家屬的角度試填；每題下方紅框「🧪 測試建議」寫下您的意見。<button class="link small" id="reset" style="font-size:15px">更換測試者</button></div>';

// ── 事件 ──
function bindAll() {
  var $ = function (q) { return Array.prototype.slice.call(document.querySelectorAll(q)); };
  $('[data-pick]').forEach(function (b) { b.onclick = function () {
    var q = ALLQ.filter(function (x) { return x.id === b.dataset.pick; })[0], a = ans(q.id), o = b.dataset.o, s = sel(q, a);
    if (q.kind === 'multi') { var ex = q.exclusiveOptions || [], n;
      if (s.indexOf(o) >= 0) n = s.filter(function (x) { return x !== o; }); else n = ex.indexOf(o) >= 0 ? [o] : s.filter(function (x) { return ex.indexOf(x) < 0; }).concat([o]);
      a.values = n; if (n.indexOf('不清楚') < 0) a.followUp = '';
    } else if (q.kind === 'fields') { a.value = a.value === o ? '' : o; }
    else { a.value = o; if (o !== '不清楚' && o !== '不確定') a.followUp = ''; }
    S.resp[q.id] = a; keep(); }; });
  $('[data-fu]').forEach(function (b) { b.onclick = function () { var a = ans(b.dataset.fu); a.followUp = b.dataset.v; S.resp[b.dataset.fu] = a; keep(); }; });
  $('[data-f]').forEach(function (el) { el.onchange = function () { var a = ans(el.dataset.q); a.fields[el.dataset.f] = el.value; S.resp[el.dataset.q] = a; keep(); }; });
  $('[data-detail]').forEach(function (el) { el.onchange = function () { var a = ans(el.dataset.detail); a.detail = el.value; S.resp[el.dataset.detail] = a; persist(); }; });
  $('[data-voice]').forEach(function (b) { b.onclick = function () { toast('家屬版會開啟錄音視窗；測試版不實際錄音'); }; });
  $('[data-verdict]').forEach(function (b) { b.onclick = function () { var f = fbOf(b.dataset.verdict); f.verdict = f.verdict === b.dataset.v ? '' : b.dataset.v; keep(); }; });
  $('[data-issue]').forEach(function (b) { b.onclick = function () { var f = fbOf(b.dataset.issue), i = f.issues.indexOf(b.dataset.v); if (i >= 0) f.issues.splice(i, 1); else f.issues.push(b.dataset.v); keep(); }; });
  $('[data-fbs]').forEach(function (el) { el.onchange = function () { fbOf(el.dataset.fbs).suggestion = el.value; persist(); }; });
  $('[data-fbr]').forEach(function (el) { el.onchange = function () { fbOf(el.dataset.fbr).reason = el.value; persist(); }; });
  $('[data-speak]').forEach(function (b) { b.onclick = function () { var t = DATA.notices[+b.dataset.speak]; speak(b.dataset.lang === 'nan' ? t.taiwanese : t.title + '。' + t.summary + t.body.join(''), b.dataset.lang); }; });
  $('[data-nq]').forEach(function (el) { el.onchange = function () { S.newq[+el.dataset.nq][el.dataset.k] = el.value; persist(); }; });
  $('[data-delnq]').forEach(function (b) { b.onclick = function () { S.newq.splice(+b.dataset.delnq, 1); keep(); }; });
  $('[data-jumpq]').forEach(function (b) { b.onclick = function () { var q = ALLQ.filter(function (x) { return x.id === b.dataset.jumpq; })[0]; S.step = DATA.secs.map(function (s) { return s.title; }).indexOf(q.section); persist(); render(); setTimeout(function () { var e = document.getElementById('q-' + q.id); e && e.scrollIntoView({ block: 'center' }); }, 50); }; });
  var add = document.getElementById('addnq'); if (add) add.onclick = function () { S.newq.push({ section: DATA.secs[0].title, label: '', options: '', reason: '' }); keep(); };
  var ov = document.getElementById('overall'); if (ov) ov.onchange = function () { S.overall = ov.value; persist(); };
  var sub = document.getElementById('submit'); if (sub) sub.onclick = submit;
  var jump = document.getElementById('jump'); if (jump) jump.onchange = function () { S.step = +jump.value; persist(); render(); window.scrollTo(0, 0); };
  var rs = document.getElementById('reset'); if (rs) rs.onclick = function () { S.started = false; persist(); render(); };
}
function keep() { var y = window.scrollY; persist(); render(); window.scrollTo(0, y); }
document.getElementById('prev').onclick = function () { if (S.step > 0) { S.step--; persist(); render(); window.scrollTo(0, 0); } };
document.getElementById('next').onclick = function () { if (S.step < STEPS.length - 1) { S.step++; persist(); render(); window.scrollTo(0, 0); } };
document.getElementById('save').onclick = function () { persist(); toast('已暫存在這台電腦，下次打開會接著填'); };

function speak(text, lang) {
  if (!('speechSynthesis' in window)) { toast('這個瀏覽器不支援語音播放'); return; }
  speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(text), vs = speechSynthesis.getVoices();
  var v = lang === 'nan' ? (vs.filter(function (x) { return /nan|hokkien|min/i.test(x.lang + x.name); })[0] || vs.filter(function (x) { return x.lang === 'zh-TW'; })[0]) : vs.filter(function (x) { return x.lang === 'zh-TW'; })[0];
  if (v) u.voice = v; u.lang = v ? v.lang : 'zh-TW'; u.rate = 0.9; speechSynthesis.speak(u);
}

function rowsForSubmit() {
  var rows = [];
  ALLQ.forEach(function (q) { var f = S.fb['q:' + q.id] || {};
    rows.push(['題目', q.section, q.no, q.label, display(q), f.verdict || '', (f.issues || []).join('、'), f.suggestion || '', f.reason || '']); });
  [['step:documents', '醫療文件與藥袋'], ['step:voice', '語音補充'], ['step:family', '共同填寫的家屬']].forEach(function (x) { var f = S.fb[x[0]];
    if (f && (f.verdict || f.suggestion || f.reason)) rows.push(['畫面', x[1], '', x[1], '', f.verdict, f.issues.join('、'), f.suggestion, f.reason]); });
  DATA.notices.forEach(function (t, i) { var f = S.fb['notice:' + t.id];
    if (f && (f.verdict || f.suggestion || f.reason)) rows.push(['入住須知', '重要照護須知', i + 1, t.title, '', f.verdict, f.issues.join('、'), f.suggestion, f.reason]); });
  S.newq.filter(function (n) { return n.label.trim(); }).forEach(function (n) { rows.push(['新增題目', n.section, '', n.label, n.options, '新增', '', n.options, n.reason]); });
  if (S.overall.trim()) rows.push(['整體意見', '', '', '整體意見', '', '', '', S.overall, '']);
  return rows;
}
function submit() {
  var btn = document.getElementById('submit'), out = document.getElementById('result');
  btn.disabled = true; btn.textContent = '送出中…';
  var payload = { tester: S.tester, role: S.role, scenario: S.scenario, rows: rowsForSubmit() };
  var ok = function (r) {
    out.innerHTML = '<div class="note ok">已送出 ' + r.count + ' 筆（測試編號 ' + r.id + '），謝謝您！如需修改，改完再送出一次即可（以最後一次為準）。</div>';
    btn.disabled = false; btn.textContent = '再次送出';
  };
  var fail = function (e) {
    out.innerHTML = '<div class="note bad">送出失敗：' + esc(e && e.message || e) + '。內容已暫存在這台裝置，請稍後再試。</div>';
    btn.disabled = false; btn.textContent = '送出測試結果';
  };
  window.__payload = payload;
  if (!window.google || !google.script) {
    if (location.protocol === 'file:') { fail('預覽模式無法送出'); return; }
    fetch(EXEC_URL, { method: 'POST', body: JSON.stringify(payload), credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r.ok) ok(r); else fail(r.error); })
      .catch(function (e) { fail('網路連線失敗（' + (e && e.message || e) + '）'); });
    return;
  }
  google.script.run.withSuccessHandler(function (r) {
    out.innerHTML = '<div class="note ok">已送出 ' + r.count + ' 筆（測試編號 ' + r.id + '），謝謝您！如需修改，改完再送出一次即可。</div>';
    btn.disabled = false; btn.textContent = '再次送出';
  }).withFailureHandler(function (e) {
    out.innerHTML = '<div class="note bad">送出失敗：' + esc(e.message || e) + '。內容已暫存在這台電腦，請稍後再試。</div>';
    btn.disabled = false; btn.textContent = '送出測試結果';
  }).saveFeedback(payload);
}
render();
</script>
